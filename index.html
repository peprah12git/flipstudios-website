<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&display=swap"
      rel="stylesheet"
    />
    <title>FlipStudios</title>
    <script>
      // Applied before first paint so the stored theme renders immediately —
      // dark is the default, light is only used when explicitly saved.
      (function () {
        try {
          if (localStorage.getItem('flipstudios-theme') === 'light') {
            document.documentElement.setAttribute('data-theme', 'light')
          }
        } catch {
          // localStorage unavailable — fall back to the default dark theme
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
